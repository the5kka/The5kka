<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>*{box-sizing:border-box;letter-spacing:0}html,body{margin:0;width:1800px;height:1260px;overflow:hidden;color:#172126;background:#e8edef;font-family:"Malgun Gothic",sans-serif}.sheet{height:100%;padding:12px 24px}.head{height:54px;display:flex;align-items:center;border-bottom:2px solid #172126}.head b{font-size:25px}.head span{margin-left:auto;font-size:10px}.grid{height:calc(100% - 54px);padding-top:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}.item{min-width:0;overflow:hidden;border:3px solid #d8584f;background:#fff}.item img{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;border-bottom:1px solid #c7d0d3}.meta{height:38px;padding:0 9px;display:flex;align-items:center;gap:8px}.no{width:29px;height:27px;display:grid;place-items:center;color:#fff;background:#d8584f;font-size:9px;font-weight:900}.name{font-size:11px;font-weight:900}.tag{margin-left:auto;color:#087f6b;font-size:8px;font-weight:900}</style></head><body><main class="sheet"><header class="head"><b>이번 추가 추천 16종</b><span>서로 닮지 않은 사용 구조 우선 후보</span></header><section class="grid" id="grid"></section></main><script>const picks=[25,27,29,31,33,35,38,39,41,45,49,50,53,54,57,60],names={25:'공공서비스 시작',27:'의료 체크인',29:'Fluent Windows 홈',31:'Carbon 데이터 작업대',33:'산업 오퍼레이터 스테이션',35:'SAP 업무 타일',38:'고대비 쉬운 선택',39:'명찰 스캔 시작',41:'승차권 발매기형',45:'여권 심사형',49:'사원증 태그 시작',50:'QR 공정 스캔',53:'공정 배치도',54:'품질 Andon',57:'전체 종이 미리보기',60:'한 번에 질문 하나'},tags={25:'공공',27:'의료',29:'Windows',31:'업무',33:'산업',35:'업무',38:'접근성',39:'키오스크',41:'키오스크',45:'글로벌',49:'스캔',50:'스캔',53:'산업',54:'산업',57:'문서',60:'초간단'};document.getElementById('grid').innerHTML=picks.map(n=>`<article class="item"><img src="screens/design_${n}.png"><div class="meta"><span class="no">${n}</span><span class="name">${names[n]}</span><span class="tag">${tags[n]}</span></div></article>`).join('');</script></body></html>

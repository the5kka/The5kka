<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;letter-spacing:0}html,body{margin:0;width:1800px;height:1200px;overflow:hidden;color:#172126;background:#e8edef;font-family:"Malgun Gothic",sans-serif}.sheet{height:100%;padding:10px 28px}.head{height:50px;display:flex;align-items:center;border-bottom:2px solid #172126}.head b{font-size:25px}.head span{margin-left:auto;font-size:11px}.grid{height:calc(100% - 50px);padding-top:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:14px}.item{min-width:0;overflow:hidden;border:1px solid #aeb9bd;background:#fff}.item img{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;border-bottom:1px solid #c7d0d3}.meta{height:42px;padding:0 10px;display:flex;align-items:center;gap:9px}.no{width:30px;height:28px;display:grid;place-items:center;color:#fff;background:#172126;font-size:10px;font-weight:900}.name{font-size:12px;font-weight:900}.tag{margin-left:auto;color:#087f6b;font-size:9px;font-weight:900}.pick{border:3px solid #d8584f}.pick .no{background:#d8584f}
</style></head><body><main class="sheet"><header class="head"><b id="title"></b><span>GLOBAL UI RESEARCH · 36 ADDITIONAL SCREENS · 1600×900</span></header><section class="grid" id="grid"></section></main><script>
const names=['공공서비스 시작','완료해야 할 세 가지','의료 체크인','안전 확인 먼저','Fluent Windows 홈','빠른 명령 검색','Carbon 데이터 작업대','Carbon 안내 입력','산업 오퍼레이터 스테이션','공장 라인 지도','SAP 업무 타일','SAP 공간과 페이지','단계 표시 서비스','고대비 쉬운 선택','명찰 스캔 시작','공항 여정 표시','승차권 발매기형','도서관 셀프대출형','POS 빠른 선택','ATM 단계 선택','여권 심사형','작업자 명단형','교실 칠판형','인증 카드 지갑','사원증 태그 시작','QR 공정 스캔','즐겨찾기 홈','최근 시험 타임라인','공정 배치도','품질 Andon','교대 인수인계','주간 시험 일정','전체 종이 미리보기','두 문서 비교','하단 도크 작업대','한 번에 질문 하나'];
const tags=['공공','공공','의료','의료','Windows','Windows','업무','업무','산업','산업','업무','업무','접근성','접근성','키오스크','키오스크','키오스크','키오스크','현장','키오스크','글로벌','관리','교육','교육','스캔','스캔','개인화','개인화','산업','산업','현장','일정','문서','문서','Windows','초간단'];
const picks=[25,27,29,31,33,35,38,39,41,49,53,57,60];const page=Number(new URLSearchParams(location.search).get('page')||1),ids=Array.from({length:9},(_,i)=>25+(page-1)*9+i).filter(n=>n<=60);document.getElementById('title').textContent=`추가 디자인 비교 ${page} / 4`;document.getElementById('grid').innerHTML=ids.map(n=>`<article class="item ${picks.includes(n)?'pick':''}"><img src="screens/design_${n}.png"><div class="meta"><span class="no">${n}</span><span class="name">${names[n-25]}</span><span class="tag">${tags[n-25]}</span></div></article>`).join('');
</script></body></html>

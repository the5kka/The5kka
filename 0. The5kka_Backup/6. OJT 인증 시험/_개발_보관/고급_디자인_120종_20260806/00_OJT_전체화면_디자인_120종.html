<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OJT Exam Maker 전체 화면 디자인 120종</title>
  <style>
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Segoe UI",sans-serif;background:#eef1f2;color:#172126}button,input{font:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{position:sticky;top:0;height:100vh;padding:24px 18px;overflow:auto;color:#f4f7f7;background:#172126;border-right:1px solid #3d4b51}
    .brand{font-size:20px;font-weight:900}.brand b{color:#2fd0b3}.brand small{margin-top:7px;display:block;color:#a9b6bb;font-size:10px}.summary{margin:24px 0;padding:14px 0;border-top:1px solid #415158;border-bottom:1px solid #415158}.summary b{display:block;font-size:30px}.summary span{color:#b7c3c7;font-size:10px}
    .side h2{margin:22px 0 8px;font-size:11px;color:#7fe2d0}.filter{width:100%;height:38px;margin:4px 0;padding:0 11px;text-align:left;color:#d7e0e2;border:1px solid #4d5d63;background:#222d32}.filter.active{color:#081513;border-color:#2fd0b3;background:#2fd0b3;font-weight:900}.tip{margin-top:22px;color:#a9b6bb;font-size:10px;line-height:1.65}
    .main{min-width:0;padding:22px}.head{display:flex;align-items:flex-start;gap:18px;margin-bottom:18px}.head h1{margin:0;font-size:25px}.head p{margin:7px 0 0;color:#68777d;font-size:11px}.head .spacer{flex:1}.search{width:320px;height:40px;padding:0 12px;border:1px solid #aab8bd;background:#fff}.count{height:40px;padding:0 14px;display:grid;place-items:center;color:#fff;background:#087f74;font-size:11px;font-weight:900}
    .chips{margin-bottom:18px;display:flex;gap:7px;flex-wrap:wrap}.chip{height:34px;padding:0 12px;border:1px solid #a9b7bc;background:#fff;font-size:10px;font-weight:800}.chip.active{color:#fff;border-color:#087f74;background:#087f74}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{min-width:0;overflow:hidden;border:1px solid #aab8bd;border-radius:6px;background:#fff;box-shadow:0 4px 0 #c4cdd0}.card.recommended{border-top:5px solid #e3a718}.preview{position:relative;aspect-ratio:16/9;overflow:hidden;background:#d5dde0;cursor:zoom-in}.preview img{width:100%;height:100%;display:block;object-fit:cover}.badge{position:absolute;left:9px;top:9px;padding:5px 7px;color:#fff;background:#172126;font-size:9px;font-weight:900}.star{position:absolute;right:9px;top:9px;padding:5px 7px;color:#171717;background:#f1c232;font-size:9px;font-weight:900}.meta{padding:12px 13px}.meta h3{margin:0;display:flex;align-items:center;gap:7px;font-size:13px}.meta h3 span{color:#087f74}.meta p{margin:7px 0 0;color:#69777c;font-size:10px;line-height:1.5}.tags{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}.tag{padding:4px 6px;border:1px solid #bbc5c8;background:#f1f4f5;font-size:8px;font-weight:800}
    .empty{grid-column:1/-1;padding:80px;text-align:center;border:1px solid #b7c1c4;background:#fff}.modal{position:fixed;inset:0;z-index:50;display:none;padding:24px;background:rgba(9,14,16,.92)}.modal.open{display:grid;grid-template-rows:auto 1fr auto;gap:12px}.modal-head,.modal-foot{display:flex;align-items:center;gap:12px;color:#fff}.modal-head h2{margin:0;font-size:17px}.modal-head span{color:#aebdc2;font-size:10px}.modal-head .spacer{flex:1}.modal button{height:38px;padding:0 14px;color:#fff;border:1px solid #738087;background:#263238;font-weight:900}.modal-stage{min-height:0;display:grid;place-items:center}.modal-stage img{max-width:100%;max-height:100%;border:1px solid #6d787d;box-shadow:0 12px 32px #000}.modal-foot{justify-content:center}.modal-foot b{min-width:160px;text-align:center}
    @media(max-width:1100px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.side .filters{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.filter{margin:0}.tip{display:none}}@media(max-width:700px){.main{padding:12px}.head{display:grid}.search{width:100%}.grid{grid-template-columns:1fr}.side .filters{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">OJT <b>DESIGN LAB</b><small>전체 화면 디자인 검토본</small></div>
      <div class="summary"><b>120</b><span>30개 업무 구조 × 4개 시험 대상</span></div>
      <h2>시험 대상</h2><div class="filters" id="roleFilters"></div>
      <h2>보기 방식</h2><div class="filters"><button class="filter active" data-view="all">전체 디자인</button><button class="filter" data-view="recommended">추천 24종</button></div>
      <p class="tip">화면을 누르면 크게 볼 수 있습니다.<br>확대 화면에서는 키보드 ← → 로 이동합니다.<br><br>마음에 드는 화면은 디자인 번호만 알려주세요. 예: <b>064번</b></p>
    </aside>
    <main class="main">
      <header class="head"><div><h1>OJT Exam Maker 전체 화면 디자인</h1><p>기존 V2 출력물은 바꾸지 않고, 프로그램 화면 구조만 새롭게 검토하는 시안입니다.</p></div><span class="spacer"></span><input class="search" id="search" placeholder="구조명, 용도, 번호 검색"><span class="count" id="count">120개</span></header>
      <div class="chips" id="categoryFilters"></div>
      <section class="grid" id="grid"></section>
    </main>
  </div>
  <div class="modal" id="modal" aria-hidden="true"><div class="modal-head"><div><h2 id="modalTitle"></h2><span id="modalSub"></span></div><span class="spacer"></span><button id="close">닫기</button></div><div class="modal-stage"><img id="modalImage" alt="선택한 디자인 확대"></div><div class="modal-foot"><button id="prev">← 이전</button><b id="modalNo"></b><button id="next">다음 →</button></div></div>
  <script>
    const concepts=[
      ["통합 관제 데스크","운영","공정·상태·문서·검증을 한 화면에서 관리","WPF / WinUI"],["대상별 시작 화면","간결","시험 대상을 먼저 고르고 바로 시작","WinUI / WPF"],["시험지 문서 스튜디오","문서","인쇄 문서를 크게 보며 속성을 조정","WPF / WinForms"],["전체 페이지 월","문서","모든 출력 페이지를 한 번에 비교","WPF / Qt"],["단계별 생성 마법사","운영","선택부터 출력까지 순서대로 진행","WinForms / WPF"],["검색 중심 콘솔","운영","공정명 검색으로 빠르게 시험 생성","WinUI / Avalonia"],["공정·대상 매트릭스","관리","여러 공정과 대상을 표에서 비교","WPF / WinForms"],["현장 터치 키오스크","현장","큰 버튼으로 대상 선택과 시험 시작","WinUI / Qt"],["컴팩트 사이드바","운영","익숙한 좌측 메뉴와 밀도 높은 업무 화면","WinForms / WPF"],["한 문제 집중 화면","현장","한 번에 한 문제만 크게 확인","WPF / Avalonia"],["페이지 개요 보드","문서","전체 페이지와 출력 구성을 동시에 확인","WPF / Qt"],["신입 교육 경로","교육","교육 완료 후 시험으로 자연스럽게 연결","WinUI / WPF"],["시험 템플릿 라이브러리","관리","자주 쓰는 시험 구성을 카드로 보관","WPF / Avalonia"],["출력 대기열 센터","관리","여러 출력 작업과 프린터 상태 관리","WinForms / WPF"],["감사 이력 타임라인","관리","생성·검증·출력 이력을 시간순 확인","WPF / WinUI"],["다국어 시험 스테이션","교육","한국어·영어·베트남어·중국어 선택","WinUI / Avalonia"],["시험 준비 칸반","관리","요청부터 완료까지 진행 단계 관리","WPF / Avalonia"],["시험 일정 캘린더","관리","정기 평가와 신규 시험 일정 관리","WinUI / WPF"],["품질 지표 콕핏","관리","문항·출력·오류 상태를 품질 지표로 확인","WPF / WinUI"],["리본형 업무 공간","운영","엑셀처럼 익숙한 상단 리본 도구","WinForms / WPF"],["문항 검토 인스펙터","문서","문항과 배점을 집중 검토한 뒤 확정","WPF / Qt"],["미니멀 실행 화면","간결","자주 쓰는 기능만 남긴 조용한 화면","WinUI / WPF"],["고대비 접근성 화면","현장","큰 글자와 강한 대비의 현장 모드","WinUI / WinForms"],["선정·출력 듀얼 화면","문서","왼쪽에서 선택하고 오른쪽에서 출력 확인","WPF / Avalonia"],["공정 흐름 블루프린트","운영","시험 생성 단계를 공정 흐름도로 표현","WPF / Qt"],["종이 우선 미리보기","문서","실제 A4 문서를 가장 크게 보는 방식","WPF / WinForms"],["대상별 밴드 선택","간결","네 대상을 넓은 가로 목록으로 구분","WinUI / Avalonia"],["시험 생성 플로우 맵","운영","현재 진행 단계를 한눈에 확인","WPF / WinUI"],["작업자 브리핑 화면","현장","작업자 확인 후 바로 시험 시작","WinUI / Qt"],["시험 패키지 탐색기","관리","시험 구성과 포함 파일을 탐색기처럼 관리","WinForms / WPF"]
    ];
    const roles=[['general','일반용'],['electrical','전장용'],['newcomer','신입용'],['foreigner','외국인용']];
    const recommendedConcepts=new Set([2,3,8,10,16,26]);
    const designs=Array.from({length:120},(_,i)=>{const no=i+1,c=Math.floor(i/4)+1,r=i%4;return{no,concept:c,role:roles[r][0],roleName:roles[r][1],name:concepts[c-1][0],category:concepts[c-1][1],desc:concepts[c-1][2],tech:concepts[c-1][3],recommended:recommendedConcepts.has(c),file:`screens/design_${String(no).padStart(3,'0')}_${roles[r][0]}.png`}});
    const state={role:'all',view:'all',category:'전체',query:''};let visible=[];let modalIndex=0;
    const roleFilters=document.getElementById('roleFilters'),categoryFilters=document.getElementById('categoryFilters'),grid=document.getElementById('grid'),count=document.getElementById('count');
    [['all','전체 대상'],...roles].forEach(([key,label],i)=>{const b=document.createElement('button');b.className='filter'+(i===0?' active':'');b.textContent=label;b.onclick=()=>{state.role=key;[...roleFilters.children].forEach(x=>x.classList.toggle('active',x===b));render()};roleFilters.appendChild(b)});
    ['전체',...new Set(concepts.map(x=>x[1]))].forEach((label,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' active':'');b.textContent=label;b.onclick=()=>{state.category=label;[...categoryFilters.children].forEach(x=>x.classList.toggle('active',x===b));render()};categoryFilters.appendChild(b)});
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});
    document.getElementById('search').oninput=e=>{state.query=e.target.value.trim().toLowerCase();render()};
    function render(){visible=designs.filter(d=>(state.role==='all'||d.role===state.role)&&(state.view==='all'||d.recommended)&&(state.category==='전체'||d.category===state.category)&&(!state.query||`${d.no} ${d.name} ${d.roleName} ${d.category} ${d.desc}`.toLowerCase().includes(state.query)));count.textContent=`${visible.length}개`;grid.innerHTML=visible.length?visible.map((d,i)=>`<article class="card ${d.recommended?'recommended':''}"><div class="preview" data-index="${i}"><img loading="lazy" src="${d.file}" alt="${d.no}번 ${d.name} ${d.roleName}"><span class="badge">${String(d.no).padStart(3,'0')} · ${d.roleName}</span>${d.recommended?'<span class="star">추천</span>':''}</div><div class="meta"><h3><span>${String(d.concept).padStart(2,'0')}</span>${d.name}</h3><p>${d.desc}</p><div class="tags"><span class="tag">${d.category}</span><span class="tag">${d.tech}</span></div></div></article>`).join(''):'<div class="empty">조건에 맞는 디자인이 없습니다.</div>';grid.querySelectorAll('.preview').forEach(el=>el.onclick=()=>openModal(Number(el.dataset.index)))}
    const modal=document.getElementById('modal'),modalImage=document.getElementById('modalImage');function openModal(index){modalIndex=index;const d=visible[index];modalImage.src=d.file;document.getElementById('modalTitle').textContent=`${String(d.no).padStart(3,'0')} · ${d.name}`;document.getElementById('modalSub').textContent=`${d.roleName} · ${d.desc} · 구현 후보 ${d.tech}`;document.getElementById('modalNo').textContent=`${index+1} / ${visible.length}`;modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
    function move(delta){if(!visible.length)return;openModal((modalIndex+delta+visible.length)%visible.length)}document.getElementById('close').onclick=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')};document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.onkeydown=e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')document.getElementById('close').click();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)};render();
  </script>
</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>*{box-sizing:border-box;letter-spacing:0}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:"Malgun Gothic","Segoe UI",sans-serif;background:#e9edef;color:#172126}.sheet{width:1920px;height:1080px;padding:16px;display:grid;grid-template-rows:54px 1fr;gap:10px}.head{display:flex;align-items:center;padding:0 14px;border-left:8px solid #087f74;background:#fff}.head h1{margin:0;font-size:22px}.head span{margin-left:auto;color:#66777d;font-size:11px}.grid{min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px}.card{min-width:0;min-height:0;padding:7px;display:grid;grid-template-rows:1fr 26px;gap:5px;border:1px solid #9eacb1;background:#fff}.card img{width:100%;height:100%;object-fit:contain;background:#d2dade}.caption{display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;font-size:10px}.caption b{color:#087f74;font-size:12px}.caption span{overflow:hidden;text-overflow:ellipsis}.recommended{border-top:5px solid #e3a718}</style></head><body><main class="sheet"><header class="head"><h1 id="title"></h1><span id="range"></span></header><section class="grid" id="grid"></section></main><script>const names=["통합 관제 데스크","대상별 시작 화면","시험지 문서 스튜디오","전체 페이지 월","단계별 생성 마법사","검색 중심 콘솔","공정·대상 매트릭스","현장 터치 키오스크","컴팩트 사이드바","한 문제 집중 화면","페이지 개요 보드","신입 교육 경로","시험 템플릿 라이브러리","출력 대기열 센터","감사 이력 타임라인","다국어 시험 스테이션","시험 준비 칸반","시험 일정 캘린더","품질 지표 콕핏","리본형 업무 공간","문항 검토 인스펙터","미니멀 실행 화면","고대비 접근성 화면","선정·출력 듀얼 화면","공정 흐름 블루프린트","종이 우선 미리보기","대상별 밴드 선택","시험 생성 플로우 맵","작업자 브리핑 화면","시험 패키지 탐색기"],roles=[['general','일반용'],['electrical','전장용'],['newcomer','신입용'],['foreigner','외국인용']],recConcepts=[2,3,8,10,16,26],q=new URLSearchParams(location.search),mode=q.get('mode')||'all',page=Math.max(1,Number(q.get('page')||1));let ids=mode==='recommended'?recConcepts.flatMap(c=>[1,2,3,4].map(r=>(c-1)*4+r)):Array.from({length:120},(_,i)=>i+1);const slice=ids.slice((page-1)*12,page*12);document.getElementById('title').textContent=mode==='recommended'?'OJT 전체 화면 추천 24종':'OJT 전체 화면 디자인 120종';document.getElementById('range').textContent=`${page} / ${Math.ceil(ids.length/12)} · ${slice[0]}-${slice[slice.length-1]}`;document.getElementById('grid').innerHTML=slice.map(no=>{const c=Math.floor((no-1)/4),r=(no-1)%4,file=`screens/design_${String(no).padStart(3,'0')}_${roles[r][0]}.png`;return`<article class="card ${recConcepts.includes(c+1)?'recommended':''}"><img src="${file}"><div class="caption"><b>${String(no).padStart(3,'0')}</b><span>${names[c]} · ${roles[r][1]}</span></div></article>`}).join('');</script></body></html>

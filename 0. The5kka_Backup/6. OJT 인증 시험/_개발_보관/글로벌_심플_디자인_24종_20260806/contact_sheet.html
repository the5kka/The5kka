<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;letter-spacing:0}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Malgun Gothic",sans-serif;background:#e8edef;color:#172126}.sheet{height:100%;padding:26px 30px}.head{height:72px;display:flex;align-items:center;border-bottom:2px solid #172126}.head b{font-size:25px}.head span{margin-left:auto;font-size:12px}.grid{height:calc(100% - 72px);padding-top:20px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:16px}.picks .grid{grid-template-rows:repeat(2,1fr)}.item{min-width:0;overflow:hidden;border:1px solid #aeb9bd;background:#fff}.item img{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;border-bottom:1px solid #c7d0d3}.meta{height:45px;padding:0 11px;display:flex;align-items:center;gap:9px}.no{width:28px;height:28px;display:grid;place-items:center;color:#fff;background:#172126;font-size:10px;font-weight:900}.name{font-size:12px;font-weight:900}.tag{margin-left:auto;color:#087f6b;font-size:9px;font-weight:900}.pick{border:3px solid #d8584f}.pick .no{background:#d8584f}
</style></head><body><main class="sheet"><header class="head"><b id="title"></b><span>OJT EXAM MAKER · 1600×900 ORIGINAL SCREENS</span></header><section class="grid" id="grid"></section></main><script>
const names=['네 개의 시작 문','한 버튼 시작','세 단계 작업대','대화형 안내','글로벌 체크인','품질 안전 콘솔','조용한 집중 화면','글로벌 타이포 그리드','역할 기둥 작업대','준비 완료 화면','종이 중심 스튜디오','페이지 덱','빠른 검색 콘솔','시험 생성 노선도','글로벌 안내 보드','큰 버튼 키오스크','간결한 품질 관제','스마트 팩토리 맵','신입 학습 경로','언어 우선 시작','작업자·관리자 분리','오늘의 시험 보드','선택·문서 분할','설명 없는 3단계'];const tags=['초간단','초간단','안내','안내','글로벌','현장','초간단','글로벌','운영','초간단','문서','문서','검색','안내','글로벌','현장','운영','현장','교육','글로벌','보안','운영','문서','초간단'];const picks=[1,2,5,7,11,16,20,24];const q=new URLSearchParams(location.search),mode=q.get('mode')||'page',page=Number(q.get('page')||1);document.body.classList.toggle('picks',mode==='picks');let ids=mode==='picks'?picks:Array.from({length:12},(_,i)=>i+1+(page-1)*12);document.getElementById('title').textContent=mode==='picks'?'추천 디자인 8종':`전체 디자인 비교 ${page} / 2`;document.getElementById('grid').innerHTML=ids.map(n=>`<article class="item ${picks.includes(n)?'pick':''}"><img src="screens/design_${String(n).padStart(2,'0')}.png"><div class="meta"><span class="no">${String(n).padStart(2,'0')}</span><span class="name">${names[n-1]}</span><span class="tag">${tags[n-1]}</span></div></article>`).join('');
</script></body></html>
